name: Build BLOOD-FIND Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparer Capacitor
        run: |
          mkdir blood-find-app
          cd blood-find-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets sharp
          mkdir www assets
          echo '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body></body></html>' > www/index.html
          npx cap init BLOOD-FIND com.bloodfind.cameroon --web-dir www
          npx cap add android

      - name: Integrer le logo BLOOD-FIND
        run: |
          node -e "require('./blood-find-app/node_modules/sharp')('blood-find-icon-512.png').resize(1024,1024).png().toFile('blood-find-app/assets/logo.png').then(()=>console.log('Logo prepare'))"

      - name: Generer les icones Android
        working-directory: blood-find-app
        run: |
          npx capacitor-assets generate --android

      - name: Configurer l'application
        working-directory: blood-find-app
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.bloodfind.cameroon",
            "appName": "BLOOD-FIND",
            "webDir": "www",
            "server": {
              "url": "https://simplice0703.github.io/blood-find-cam/",
              "cleartext": false
            }
          }
          EOF
          npx cap sync android

      - name: Construire APK
        working-directory: blood-find-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOOD-FIND-APK
          path: blood-find-app/android/app/build/outputs/apk/debug/app-debug.apk
